<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="d4.css">
</head>
<body>
      
    <form action="/contact" method="post">
         <h1>Contact Us</h1>
<p>If you have any questions or inquiries, please fill out the form below and we will get back to you as soon as possible.</p>
 <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message..."></textarea>

        <button type="submit">Send message</button>
    </form>
</body>
</html>
